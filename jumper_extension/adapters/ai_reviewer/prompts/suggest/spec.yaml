given:
  - id: code
    enabled: true
    text: >-
      Cell source code - or, when several cells were reviewed, all of them, each
      preceded by a "# --- cell N ---" marker
  - id: analysis
    enabled: true
    text: Bottleneck analysis
  - id: hardware
    enabled: true
    text: Description of the available hardware
  - id: packages
    enabled: true
    text: Preinstalled libraries

rules:
  - id: gpu_offload
    enabled: false
    fragment: gpu_offload.md
  - id: options_schema
    enabled: true
    text: |-
      Each option must contain:
        - "title": a short (3-6 word) name for the optimization technique
        - "description": one or two sentences explaining what changes and why it helps
        - "code": the COMPLETE rewritten source of ONE cell implementing the suggestion
        - "target_cell_index": the index of that cell, matching a "# --- cell N ---"
          marker; null when only one cell was reviewed
  - id: focused_rewrite
    enabled: true
    text: >-
      Keep each suggested rewrite focused on a single optimization idea, runnable as a
      standalone notebook cell, and as close to the original code as possible outside of
      the optimized section.
  - id: single_cell_target
    enabled: true
    text: >-
      Each option must rewrite exactly one cell, replacing it in place - the marked cells
      around it stay untouched, so never merge several cells into one and never include
      the "# --- cell N ---" markers in the returned code. When the fix would span several
      cells, target the one that dominates the measured time and explain the rest in the
      description.
  - id: preserve_comments
    enabled: true
    text: Do not modify comments in code regions unrelated to the optimization.
  - id: preserve_style
    enabled: true
    text: Do not change the coding style of code regions unrelated to the optimization.
  - id: pep8_multiline
    enabled: true
    fragment: pep8_multiline.md
  - id: r_style
    enabled: false
    fragment: r_style.md
  - id: json_output
    enabled: true
    text: Return the options as a JSON array matching the requested schema, ordered from most to least impactful.

user_note:
  id: user_note
  enabled: false
  text: ""
