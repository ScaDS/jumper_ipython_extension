given:
  - id: code
    enabled: true
    text: Source code of a notebook cell
  - id: tags
    enabled: true
    text: Performance classification tags JUmPER assigned to it
  - id: perf
    enabled: true
    text: Summary of the measured CPU/GPU/memory metrics
  - id: raw_perf
    enabled: false
    text: >-
      Raw per-timestep metric arrays behind the %perfmonitor_plot charts - the same
      time series the plots are drawn from, given as {column: [values]} arrays (time,
      cell_index, and one array per metric)
  - id: hardware
    enabled: true
    text: Description of the available hardware

hints:
  - id: parallel_analysis_hint
    enabled: false
    text: >-
      Pay special attention to whether the workload under-uses available parallel
      hardware - an idle GPU or unused CPU cores.
