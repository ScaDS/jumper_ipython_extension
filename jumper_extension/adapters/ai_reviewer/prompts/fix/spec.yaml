given:
  - id: code
    enabled: true
    text: Source of the cell as you last proposed it
  - id: error
    enabled: true
    text: >-
      Error it failed with - a traceback, or a note that it was killed for running
      far longer than the code it replaces

rules:
  - id: keep_idea
    enabled: true
    text: >-
      Fix the failure without abandoning the optimization: if the idea cannot work here
      at all, fall back to the closest variant that does.
  - id: no_fabrication
    enabled: true
    text: >-
      The cell runs after the rest of the notebook, so names it does not define already
      exist. Never invent, re-create or stub out input data to silence a NameError - fix
      how the code uses what is there.
  - id: code_only
    enabled: true
    text: Return only the corrected cell source, with no commentary and no markdown fences.
  - id: pep8_multiline
    enabled: true
    fragment: pep8_multiline.md

user_note:
  id: user_note
  enabled: false
  text: ""
