llm:
  base_url: https://llm.scads.ai/v1
  model: MiniMaxAI/MiniMax-M3-MXFP8
  max_tokens: 16000
  timeout: 520.0
  max_retries: 2
  streaming: true
  temperature: null
  top_p: null
  seed: null
  enable_thinking: true
  # arbitrary vLLM passthrough (top_k, min_p, repetition_penalty, guided_*, ...)
  extra_body: {}
  api_key_env: JUMPER_AI_API_KEY

benchmark:
  # Timed replays per suggestion; the first is dropped as warm-up.
  runs: 3
  # LLM repair rounds before a suggestion is reported as failed.
  fix_attempts: 3
  # Sampling interval for benchmark replays, finer than the live monitor's so
  # that a fast variant still yields metrics.
  interval: 0.05
  # A variant is killed past this multiple of the baseline duration.
  timeout_factor: 10.0

context:
  strategy: faster

  known_packages:
    # arrays / numerics
    - numpy
    - scipy
    - pandas
    - polars
    - pyarrow
    # ML / DL
    - torch
    - tensorflow
    - jax
    - jaxlib
    - scikit-learn
    - xgboost
    - lightgbm
    - catboost
    - transformers
    - accelerate
    - datasets
    - peft
    # GPU compute
    - cupy-cuda11x
    - cupy-cuda12x
    - cupy
    - cuml
    - cudf
    - pynvml
    - triton
    # parallelism / JIT
    - numba
    - joblib
    - dask
    - ray
    # viz
    - matplotlib
    - plotly
